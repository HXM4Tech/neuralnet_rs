[package]
name = "neuralnet_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = { version = "0.17.2", features = ["serde"] }
onnx-pb = "0.1.4"
prost = "0.6.1"
rand = "0.10.1"
rand_distr = "0.6.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
